[package]
name = "neco-eigensolve-faer"
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Faer adapter for symmetric generalized and real nonsymmetric eigenvalue problems, complex LU solves, and condition numbers"
documentation = "https://docs.rs/neco-eigensolve-faer"
readme = "README.md"
keywords = ["eigenvalue", "generalized", "faer", "numerics"]
categories = ["mathematics"]
include = [
    "Cargo.toml",
    "src/lib.rs",
    "src/nonsymmetric.rs",
    "src/complex_lu.rs",
    "src/convert.rs",
    "src/refine.rs",
    "src/refine/groups.rs",
    "src/refine/residual.rs",
    "src/refine/subspace.rs",
    "src/condition.rs",
    "README.md",
    "README-ja.md",
    "LICENSE",
]

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
neco-complex = { path = "../neco-complex", version = "=0.2.1" }
neco-eigensolve = { path = "../neco-eigensolve", version = "=0.2.3" }
neco-generalized-eigen = { path = "../neco-generalized-eigen", version = "=0.2.2" }
neco-linear-dense = { path = "../neco-linear-dense", version = "=0.1.1" }
neco-linear-types = { path = "../neco-linear-types", version = "=0.1.1" }

[dev-dependencies]
neco-bigint = { path = "../neco-bigint", version = "=0.1.2" }
neco-expr = { path = "../neco-expr", version = "=0.2.0" }
neco-formsum = { path = "../neco-formsum", version = "=0.1.2" }
neco-linear-exact = { path = "../neco-linear-exact", version = "=0.2.0" }
