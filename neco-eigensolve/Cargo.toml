[package]
name = "neco-eigensolve"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "deterministic symmetric eigensolver for numerical linear algebra"
documentation = "https://docs.rs/neco-eigensolve"
readme = "README.md"
keywords = ["eigenvalue", "jacobi", "matrix", "numerics"]
categories = ["mathematics", "no-std"]
include = ["Cargo.toml", "src/lib.rs", "README.md", "README-ja.md", "LICENSE"]

[features]
default = ["std"]
std = [
    "neco-complex/std",
    "neco-generalized-eigen/std",
    "neco-linear-dense/std",
    "neco-linear-types/std",
    "neco-sparse/std",
]

[dependencies]
neco-complex = { path = "../neco-complex", version = "=0.2.0", default-features = false }
neco-generalized-eigen = { path = "../neco-generalized-eigen", version = "=0.2.0", default-features = false }
neco-linear-dense = { path = "../neco-linear-dense", version = "=0.1.0", default-features = false }
neco-linear-types = { path = "../neco-linear-types", version = "=0.1.0", default-features = false }
neco-sparse = { path = "../neco-sparse", version = "=0.2.0", default-features = false }
