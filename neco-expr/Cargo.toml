[package]
name = "neco-expr"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "exact expression graphs with certified floating-point approximations"
documentation = "https://docs.rs/neco-expr"
readme = "README.md"
keywords = ["exact-arithmetic", "expression", "interval", "algebra"]
categories = ["mathematics", "no-std"]
include = ["Cargo.toml", "src/*.rs", "tests/*.rs", "README.md", "README-ja.md", "LICENSE"]

[features]
default = ["std"]
std = ["neco-bigint/std", "neco-monomial/std", "neco-formsum/std", "neco-algnum/std"]

[dependencies]
neco-algnum = { path = "../neco-algnum", version = "=0.1.1", default-features = false }
neco-bigint = { path = "../neco-bigint", version = "=0.1.1", default-features = false }
neco-formsum = { path = "../neco-formsum", version = "=0.1.1", default-features = false }
neco-monomial = { path = "../neco-monomial", version = "=0.1.1", default-features = false }
