[package]
name = "neco-monomial"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "prime-exponent monomials for exact rational radicals"
documentation = "https://docs.rs/neco-monomial"
readme = "README.md"
keywords = ["exact-arithmetic", "radical", "monomial", "algebra"]
categories = ["mathematics", "no-std"]
include = [
    "Cargo.toml",
    "src/lib.rs",
    "src/basis.rs",
    "src/error.rs",
    "src/monomial.rs",
    "src/prime.rs",
    "src/raw.rs",
    "README.md",
    "README-ja.md",
    "LICENSE",
]

[features]
default = ["std"]
std = ["neco-bigint/std"]

[dependencies]
neco-bigint = { path = "../neco-bigint", version = "=0.1.1", default-features = false }
