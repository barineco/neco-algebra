name = "neco-algebra-verify"
version = "0.1.0"
defaultTargets = ["NecoAlgebraVerify", "neco-algebra-checker"]

[leanOptions]
autoImplicit = false

[[require]]
name = "neco-lean"
path = "../../../../neco-lean/neco-lean-main"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "520045ab14e26149ee970e2e617ca04b09bde5d6"

[[lean_lib]]
name = "NecoAlgebraVerify"

[[lean_exe]]
name = "neco-algebra-checker"
root = "NecoAlgebraVerifyTests"
